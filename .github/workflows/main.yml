name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate project and Build
      run: |
        # Procura onde esta o ficheiro settings.gradle ou build.gradle
        BUILD_DIR=$(dirname $(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1))
        echo "Pasta do projeto encontrada em: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xcloud-enhancer-apk
        path: '**/build/outputs/apk/debug/*.apk'
