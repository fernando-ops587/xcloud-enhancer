name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate project and Build
      run: |
        # Procura onde esta o ficheiro settings.gradle ou build.gradle
        BUILD_DIR=$(dirname $(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1))
        echo "Pasta do projeto encontrada em: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        else
          gradle assembleRelease
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcloud-enhancer-apk
        path: '**/build/outputs/apk/release/*.apk'

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: '**/build/outputs/apk/release/*.apk'
        generate_release_notes: true
